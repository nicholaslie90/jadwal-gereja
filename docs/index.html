<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00529b">
<title>Jadwal Pelayanan · GYS Tanjung Duren</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --teal:#00a2b1; --teal-dark:#008795; --blue:#00529b; --blue-dark:#003f77;
  --ink:#0f2233; --muted:#5d7286; --line:#e2e9ef; --bg:#f2f6f9; --card:#fff;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,34,51,.06), 0 8px 24px -12px rgba(15,34,51,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; overflow-x:hidden;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:6px}

/* ---------- boot / lock ---------- */
#boot,#lock,#app{display:none}
body[data-state=boot] #boot{display:grid}
body[data-state=lock] #lock{display:grid}
body[data-state=app] #app{display:block}

#boot{place-items:center; min-height:100dvh}
.spinner{
  width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--teal);
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#lock{place-items:center; min-height:100dvh; padding:24px}
.gate{
  width:100%; max-width:380px; background:var(--card); border-radius:22px;
  padding:36px 28px 30px; box-shadow:var(--shadow); text-align:center;
}
.gate img{width:100%; max-width:240px; height:auto; margin:0 auto 22px; display:block}
.gate h1{font-size:1.0625rem}
.gate p{margin:6px 0 22px; color:var(--muted); font-size:.875rem}
.field{position:relative; display:flex; gap:8px}
input[type=password]{
  flex:1; min-width:0; font:inherit; padding:13px 15px; border-radius:12px;
  border:1.5px solid var(--line); background:#fbfdfe; color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
input[type=password]:focus{
  outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(0,162,177,.14);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:13px 18px; border-radius:12px; font-weight:600; font-size:.9375rem;
  background:linear-gradient(135deg,var(--teal),var(--blue)); color:#fff;
  text-decoration:none; transition:filter .15s, transform .06s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.err{
  margin:14px 0 0; min-height:1.25em; font-size:.8125rem; color:#c62828; font-weight:550;
}
.shake{animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
}

/* ---------- app shell ---------- */
.wrap{max-width:720px; margin:0 auto; padding:18px 16px 56px}
header{display:flex; align-items:center; gap:12px; margin-bottom:18px}
header img{flex:0 1 216px; min-width:120px; max-width:216px; height:auto; display:block}
header .meta{
  margin-left:auto; text-align:right; font-size:.6875rem; color:var(--muted);
  line-height:1.35; white-space:pre-line;
}
.iconbtn{
  padding:8px; border-radius:10px; color:var(--muted); line-height:0;
  transition:background .15s, color .15s;
}
.iconbtn:hover{background:#e6edf2; color:var(--ink)}

/* ---------- next duty hero ---------- */
.hero{
  background:linear-gradient(135deg,var(--teal) 0%,var(--blue) 78%); color:#fff;
  border-radius:20px; padding:20px; margin-bottom:20px;
  box-shadow:0 10px 30px -14px rgba(0,82,155,.6);
}
.hero .eyebrow{
  font-size:.6875rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  opacity:.82;
}
.hero .when{display:flex; align-items:baseline; flex-wrap:wrap; gap:10px; margin:6px 0 2px}
.hero .when strong{font-size:1.375rem; font-weight:700; letter-spacing:-.02em}
.pill{
  font-size:.6875rem; font-weight:700; padding:3px 9px; border-radius:999px;
  background:rgba(255,255,255,.22); white-space:nowrap;
}
.hero .time{font-size:.875rem; opacity:.9}
.hero ul{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:7px}
.hero li{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  background:rgba(255,255,255,.15); border-radius:11px; padding:9px 12px; font-size:.875rem;
}
.hero li b{font-weight:700}
.hero .btn{
  margin-top:14px; width:100%; background:#fff; color:var(--blue-dark);
  box-shadow:0 2px 10px -4px rgba(0,0,0,.3);
}

/* ---------- tabs ---------- */
[role=tablist]{
  display:flex; gap:4px; background:#e6edf2; padding:4px; border-radius:12px; margin-bottom:18px;
}
[role=tab]{
  flex:1; padding:9px 10px; border-radius:9px; font-size:.875rem; font-weight:600;
  color:var(--muted); transition:background .15s, color .15s;
}
[role=tab][aria-selected=true]{background:var(--card); color:var(--blue); box-shadow:var(--shadow)}
[role=tabpanel][hidden]{display:none}

/* ---------- duty list ---------- */
.monthhead{
  font-size:.6875rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:22px 0 9px;
}
.monthhead:first-child{margin-top:0}
.duty{
  display:flex; align-items:center; gap:13px; background:var(--card); border-radius:var(--radius);
  padding:13px 14px; margin-bottom:9px; box-shadow:var(--shadow);
}
.duty .date{
  flex:0 0 46px; text-align:center; border-right:1px solid var(--line); padding-right:11px;
}
.duty .date .d{font-size:1.25rem; font-weight:700; line-height:1.1; letter-spacing:-.02em}
.duty .date .m{font-size:.625rem; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.duty .body{flex:1; min-width:0}
.duty .role{font-weight:650; font-size:.9375rem}
.duty .sub{font-size:.75rem; color:var(--muted); margin-top:1px}
.who{
  display:inline-block; font-size:.625rem; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:2px 7px; border-radius:999px; margin-right:6px;
  vertical-align:1px;
}
.who.nicholas{background:rgba(0,82,155,.11); color:var(--blue)}
.who.cindy{background:rgba(0,162,177,.14); color:var(--teal-dark)}
.addcal{
  flex:0 0 auto; padding:9px; border-radius:11px; background:#eef4f8; color:var(--blue);
  line-height:0; transition:background .15s;
}
.addcal:hover{background:#dde8f0}
details{margin-top:20px}
summary{
  cursor:pointer; font-size:.8125rem; color:var(--muted); font-weight:600;
  padding:8px 2px; list-style:revert;
}
.empty{
  background:var(--card); border-radius:var(--radius); padding:30px 20px; text-align:center;
  color:var(--muted); font-size:.875rem; box-shadow:var(--shadow);
}

/* ---------- full schedule ---------- */
.blockcard{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden}
.blockcard h3{padding:13px 15px; font-size:.8125rem; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); border-bottom:1px solid var(--line)}
.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; font-size:.8125rem; min-width:100%}
th,td{padding:9px 11px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line)}
th{
  font-size:.625rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); background:#f7fafc; position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
td.day{font-weight:650}
tr.ours{background:rgba(0,162,177,.07)}
tr.ours td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
mark{background:rgba(0,162,177,.28); color:inherit; border-radius:4px; padding:1px 3px; font-weight:700}
footer{margin-top:26px; text-align:center; font-size:.6875rem; color:var(--muted)}
footer a{color:var(--teal-dark)}
</style>
</head>
<body data-state="boot">

<div id="boot"><div class="spinner" role="status" aria-label="Memuat"></div></div>

<div id="lock">
  <form class="gate" id="gate" autocomplete="on">
    <img src="logo.png" alt="Gereja Yesus Sejati">
    <h1>Jadwal Pelayanan</h1>
    <p>Tanjung Duren · masukkan password untuk membuka</p>
    <div class="field">
      <label for="pw" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn" type="submit">Buka</button>
    </div>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
</div>

<div id="app">
  <div class="wrap">
    <header>
      <img src="logo.png" alt="Gereja Yesus Sejati">
      <div class="meta" id="meta"></div>
      <button class="iconbtn" id="lockbtn" title="Kunci halaman" aria-label="Kunci halaman">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </header>

    <div id="hero"></div>

    <div role="tablist" aria-label="Tampilan">
      <button role="tab" id="tab-mine" aria-controls="panel-mine" aria-selected="true">Tugas Kami</button>
      <button role="tab" id="tab-all" aria-controls="panel-all" aria-selected="false">Jadwal Lengkap</button>
    </div>
    <div role="tabpanel" id="panel-mine" aria-labelledby="tab-mine"></div>
    <div role="tabpanel" id="panel-all" aria-labelledby="tab-all" hidden></div>

    <footer>
      <a href="https://maps.app.goo.gl/YJafmvMSeuE1cbzCA" target="_blank" rel="noopener">
        GYS Tanjung Duren · lihat di Google Maps</a>
    </footer>
  </div>
</div>

<script>
const STORE = "gys.pw";
const CHURCH = "Gereja Yesus Sejati (GYS) Tanjung Duren";
const MAPS = "https://maps.app.goo.gl/YJafmvMSeuE1cbzCA";
const WIB_OFFSET = 7;

// Whoever opens the page is adding the event to their own calendar, so inviting
// both keeps each other in the loop; your own address is a no-op for Google.
const GUEST = { Nicholas: "nicholaslie90@gmail.com", Cindy: "cindy.wijaya15@gmail.com" };

const ROLE_LABEL = {
  "P'BICARA":"Pembicara", "P’BICARA":"Pembicara", "PEMBICARA":"Pembicara",
  "PUJIAN":"Pujian", "PEMUSIK":"Pemusik", "PENCATAT":"Pencatat", "ABSENSI":"Absensi",
  "TEAM AV":"Team AV", "PENGUMUMAN":"Pengumuman", "PENYAMBUT TAMU":"Penyambut Tamu",
  "PENYAMBUT TAMU (LT.1)":"Penyambut Tamu (Lt. 1)", "KONSUMSI":"Konsumsi",
  "PETUGAS SNACK":"Petugas Snack", "ACARA":"Acara",
};
const role = (r) => ROLE_LABEL[r.toUpperCase()] || r;

/* ---------- dates: parse as local midnight so day-diff never slips a day ---------- */
const parseDay = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const todayLocal = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const daysUntil = (iso) => Math.round((parseDay(iso) - todayLocal()) / 864e5);
const fmtFull = (iso) => parseDay(iso).toLocaleDateString("id-ID", { weekday:"long", day:"numeric", month:"long" });
const fmtShort = (iso) => parseDay(iso).toLocaleDateString("id-ID", { weekday:"short", day:"numeric" });
const countdown = (n) =>
  n === 0 ? "Hari ini" : n === 1 ? "Besok" : n > 1 ? `${n} hari lagi` : `${-n} hari lalu`;

/* ---------- Google Calendar ---------- */
function calendarUrl(items) {
  const first = items[0];
  const roles = [...new Set(items.map((i) => `${role(i.role)} (${i.who})`))].join(", ");
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: `Pelayanan GYS · ${roles}`,
    location: CHURCH,
    details: `${first.block}${first.day ? " · " + first.day : ""}\n${roles}\n\n${MAPS}`,
    dates: dateRange(first),
  });
  const guests = [...new Set(items.map((i) => GUEST[i.who]).filter(Boolean))];
  if (guests.length) p.set("add", guests.join(","));
  return "https://calendar.google.com/calendar/render?" + p;
}
function dateRange(item) {
  const stamp = (d) => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
  const [y, m, d] = item.date.split("-").map(Number);
  if (!item.start || !item.end) {
    // No parseable time -> all-day event, which is still useful.
    const plain = (dt) => dt.toISOString().slice(0, 10).replace(/-/g, "");
    return `${plain(new Date(Date.UTC(y, m - 1, d)))}/${plain(new Date(Date.UTC(y, m - 1, d + 1)))}`;
  }
  // The sheet's times are WIB; convert to UTC explicitly rather than trusting
  // whatever timezone the phone happens to be in.
  const at = (hhmm) => {
    const [hh, mm] = hhmm.split(":").map(Number);
    return new Date(Date.UTC(y, m - 1, d, hh - WIB_OFFSET, mm));
  };
  return `${stamp(at(item.start))}/${stamp(at(item.end))}`;
}

/* ---------- crypto: mirrors scripts/encrypt.mjs ---------- */
const un64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(payload, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:un64(payload.salt), iterations:payload.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:un64(payload.iv) }, key, un64(payload.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- tiny DOM helper: text only, never innerHTML ---------- */
function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) n.append(kid);
  return n;
}
const CAL_ICON = () => {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("width", "18"); svg.setAttribute("height", "18");
  svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2"); svg.setAttribute("stroke-linecap", "round");
  for (const d of ["M4 7h16v14H4z", "M8 3v4M16 3v4M4 11h16", "M12 15v3M10.5 16.5h3"]) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); svg.append(p);
  }
  return svg;
};
const calLink = (items, cls, label) =>
  el("a", { class: cls, href: calendarUrl(items), target: "_blank", rel: "noopener",
            title: "Tambahkan ke Google Calendar", "aria-label": `Tambahkan ${label} ke Google Calendar` },
     cls === "btn" ? [CAL_ICON(), el("span", { text: "Tambahkan ke Google Calendar" })] : CAL_ICON());

/* ---------- render ---------- */
function render(data) {
  document.getElementById("meta").textContent = "Data per\n" +
    parseDay(data.generated.slice(0, 10)).toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });

  const upcoming = data.mine.filter((d) => daysUntil(d.date) >= 0);
  const past = data.mine.filter((d) => daysUntil(d.date) < 0).reverse();

  renderHero(upcoming);
  renderMine(upcoming, past);
  renderAll(data);
}

function renderHero(upcoming) {
  const host = document.getElementById("hero");
  host.replaceChildren();
  if (!upcoming.length) return;
  const nextDate = upcoming[0].date;
  const items = upcoming.filter((d) => d.date === nextDate);
  const n = daysUntil(nextDate);

  host.append(el("div", { class: "hero" }, [
    el("div", { class: "eyebrow", text: "Tugas berikutnya" }),
    el("div", { class: "when" }, [
      el("strong", { text: fmtFull(nextDate) }),
      el("span", { class: "pill", text: countdown(n) }),
    ]),
    el("div", { class: "time", text: [items[0].day, items[0].time].filter(Boolean).join(" · ") }),
    el("ul", {}, items.map((i) =>
      el("li", {}, [el("b", { text: i.who }), el("span", { text: "· " + role(i.role) })]))),
    calLink(items, "btn", "tugas " + fmtFull(nextDate)),
  ]));
}

function dutyRow(d) {
  return el("div", { class: "duty" }, [
    el("div", { class: "date" }, [
      el("div", { class: "d", text: String(parseDay(d.date).getDate()) }),
      el("div", { class: "m", text: parseDay(d.date).toLocaleDateString("id-ID", { month: "short" }) }),
    ]),
    el("div", { class: "body" }, [
      el("div", { class: "role" }, [
        el("span", { class: "who " + d.who.toLowerCase(), text: d.who }),
        el("span", { text: role(d.role) }),
      ]),
      el("div", { class: "sub", text: [fmtShort(d.date), d.time, d.block].filter(Boolean).join(" · ") }),
    ]),
    calLink([d], "addcal", `${role(d.role)} ${fmtShort(d.date)}`),
  ]);
}

function groupByMonth(list) {
  const out = [];
  for (const d of list) {
    if (!out.length || out.at(-1).label !== d.month) out.push({ label: d.month, items: [] });
    out.at(-1).items.push(d);
  }
  return out;
}

function renderMine(upcoming, past) {
  const host = document.getElementById("panel-mine");
  host.replaceChildren();
  if (!upcoming.length) {
    host.append(el("div", { class: "empty", text: "Belum ada jadwal tugas yang akan datang." }));
  }
  for (const g of groupByMonth(upcoming)) {
    host.append(el("div", { class: "monthhead", text: g.label }));
    for (const d of g.items) host.append(dutyRow(d));
  }
  if (past.length) {
    const box = el("details", {}, [el("summary", { text: `Sudah lewat (${past.length})` })]);
    for (const d of past) box.append(dutyRow(d));
    host.append(box);
  }
}

function renderAll(data) {
  const host = document.getElementById("panel-all");
  host.replaceChildren();
  // Keyed on the day too: Sabtu Pagi and Sabtu Siang share a date, and only the
  // service we actually serve in should light up.
  const ours = new Set(data.mine.map((d) => `${d.date}|${d.day}|${d.block}`));
  for (const month of data.months) {
    host.append(el("div", { class: "monthhead", text: month.label }));
    for (const block of month.blocks) {
      const dayIdx = block.headers.findIndex((h) => h.toUpperCase() === "HARI") - 1;
      const thead = el("thead", {}, [
        el("tr", {}, block.headers.map((h) => el("th", { text: h === "TGL" ? "Tanggal" : role(h) }))),
      ]);
      const tbody = el("tbody", {}, block.rows.map((r) => {
        const day = dayIdx >= 0 ? r.cells[dayIdx] : "";
        const tr = el("tr", { class: ours.has(`${r.date}|${day}|${block.name}`) ? "ours" : null }, [
          el("td", { class: "day", text: fmtShort(r.date) }),
        ]);
        for (const cell of r.cells) tr.append(el("td", {}, highlight(cell)));
        return tr;
      }));
      host.append(el("div", { class: "blockcard" }, [
        el("h3", { text: block.name }),
        el("div", { class: "scroller" }, el("table", {}, [thead, tbody])),
      ]));
    }
  }
}

// Highlight our names inside a cell without ever building HTML from sheet text.
const NAME_RE = /nic(?:h)?olas(?:\s+xie?\b)?|cindy/gi;
function highlight(text) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(NAME_RE)) {
    const isUs = !/\bxie?$/i.test(m[0]);
    frag.append(text.slice(last, m.index));
    frag.append(isUs ? el("mark", { text: m[0] }) : m[0]);
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last));
  return frag;
}

/* ---------- tabs ---------- */
for (const key of ["mine", "all"]) {
  document.getElementById("tab-" + key).addEventListener("click", () => {
    for (const k of ["mine", "all"]) {
      document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === key));
      document.getElementById("panel-" + k).hidden = k !== key;
    }
  });
}

/* ---------- boot ---------- */
const setState = (s) => { document.body.dataset.state = s; };
const gate = document.getElementById("gate");
const pwInput = document.getElementById("pw");
const errBox = document.getElementById("err");
let payload = null;

function fail(message) {
  errBox.textContent = message;
  gate.classList.remove("shake");
  void gate.offsetWidth;
  gate.classList.add("shake");
}

async function unlock(password, { quiet = false } = {}) {
  try {
    render(await decrypt(payload, password));
    localStorage.setItem(STORE, password);
    setState("app");
    return true;
  } catch {
    localStorage.removeItem(STORE);
    setState("lock");
    if (!quiet) fail("Password salah. Coba lagi.");
    return false;
  }
}

gate.addEventListener("submit", async (e) => {
  e.preventDefault();
  errBox.textContent = "";
  const value = pwInput.value;
  pwInput.value = "";
  if (value) await unlock(value);
});

document.getElementById("lockbtn").addEventListener("click", () => {
  localStorage.removeItem(STORE);
  setState("lock");
  pwInput.focus();
});

(async () => {
  try {
    const res = await fetch("data.json?v=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    payload = await res.json();
  } catch {
    setState("lock");
    fail("Gagal memuat data jadwal. Coba refresh.");
    return;
  }
  const saved = localStorage.getItem(STORE);
  // Already unlocked once on this device -> go straight in.
  if (saved && (await unlock(saved, { quiet: true }))) return;
  setState("lock");
  pwInput.focus();
})();
</script>
